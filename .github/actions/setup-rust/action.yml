name: Setup Rust toolchain
description: Check out the repo, install the stable Rust toolchain (optionally with extra targets/components) and enable the cargo cache. Shared by the CI and publish workflows.

inputs:
  targets:
    description: Space-separated rustup targets to install (e.g. a build target triple)
    required: false
    default: ""
  components:
    description: Space-separated rustup components to install (e.g. rustfmt clippy)
    required: false
    default: ""
  cache-key:
    description: Extra key suffix to isolate the cargo cache (e.g. per build target triple)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}