name: CI

# fmt + clippy + tests on every push to main and on pull requests, across
# Linux, macOS and Windows — the local commit hook only covers the platform
# you develop on, and `publish.yml` only runs on tags, so this is the only
# place where platform-specific code (hardlink.rs) is verified everywhere.
#
# Deliberately mirrors the local quality gate (fmt --check + clippy --all-targets)
# without stricter rules, so CI never fails where the local gate passed.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: write # upload-artifact

env:
  CARGO_TERM_COLOR: never

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Test
        run: cargo test

      - name: Build release binary
        shell: bash
        # Embed CI build metadata (semver build metadata) into the version,
        # so `--version` distinguishes CI artifacts from tagged releases:
        # e.g. `uv-prune 0.1.0+ci.42.a1b2c3d4` vs `uv-prune 0.1.0`.
        run: |
          UV_PRUNE_BUILD_META="ci.${{ github.run_number }}.${GITHUB_SHA:0:8}" \
            cargo build --release

      - name: Verify CI version marker
        shell: bash
        run: |
          VERSION_OUTPUT="$(target/release/uv-prune --version)"
          echo "Built: $VERSION_OUTPUT"
          case "$VERSION_OUTPUT" in
            *+ci.*) ;;
            *) echo "::error::CI build version missing +ci. marker, got: $VERSION_OUTPUT"; exit 1 ;;
          esac

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: uv-prune-${{ matrix.os }}
          path: |
            target/release/uv-prune
            target/release/uv-prune.exe
          if-no-files-found: error
